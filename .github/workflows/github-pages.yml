name: github-pages

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches:
      - master

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-and-deploy:
    name: Github Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # If you're using actions/checkout@v2 you must set persist-credentials to false in most cases for the deployment to work correctly.
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0

      - name: Build Reveal
        working-directory: viewer
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:prod

      - name: Install and Build documentation 🔧
        working-directory: documentation
        run: |
          yarn install --immutable
          yarn build

      - name: Deploy documentation 🚀
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          deploy_key: ${{ secrets.REVEAL_DOCS_DEPLOY_KEY }}
          external_repository: cognitedata/reveal-docs
          publish_branch: master
          publish_dir: documentation/build
